<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="title desc">
<title id="title">Harun Nur Rasyid — Backend Engineer and Systems Thinker</title>
<desc id="desc">Bold, original comic-editorial GitHub profile banner. Harun Nur Rasyid on the left, an engineering emblem on the right, with restrained SVG animation.</desc>
<style>
  .small { font-family: 'DejaVu Sans Mono',Consolas,monospace; font-weight:700; letter-spacing:1.4px; }
  .display {font-family: Impact, 'Arial Black', 'DejaVu Sans',sans-serif; font-weight:900;}
  .orbit {transform-origin: 892px 247px; animation: turn 24s linear infinite;}
  .sticker {transform-origin: 898px 107px; animation: sticker 3s ease-in-out infinite alternate;}
  .spark {animation: pulse 2.4s ease-in-out infinite;}
  @keyframes turn {to{transform:rotate(360deg)}}
  @keyframes sticker {to{transform:rotate(2deg) translateY(-3px)}}
  @keyframes pulse {50%{opacity:.28}}
  @media (prefers-reduced-motion:reduce){.orbit,.sticker,.spark{animation:none!important}}
</style>
<defs>
  <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#d9d1c3" stroke-width="0.65" fill="none"/></pattern>
  <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="8.5" cy="8.5" r="2.4" fill="#12131a" opacity=".16"/></pattern>
  <clipPath id="rightClip"><path d="M715 48H1080V435H679Z"/></clipPath>
</defs>
<!-- Solid visual regions; the name never collides with the artwork. -->
<rect width="1080" height="470" rx="12" fill="#f8f1e4"/>
<rect x="0" y="48" width="700" height="389" fill="url(#paper)"/>
<path d="M715 48H1080V435H679Z" fill="#f04746"/>
<g clip-path="url(#rightClip)"><rect x="682" y="50" width="398" height="389" fill="url(#dots)"/></g>
<path d="M713 48L678 436" stroke="#13131a" stroke-width="9"/>
<!-- Top header -->
<path d="M0 12Q0 0 12 0H1068Q1080 0 1080 12V48H0Z" fill="#12131a"/>
<text x="38" y="31" font-size="16" class="small" fill="#f8f1e4">HARUN.DEV  /  PROFILE 001</text>
<rect x="778" y="14" width="9" height="9" fill="#cfff5b"/>
<text x="798" y="31" font-size="13" class="small" fill="#f8f1e4">BUILD · THINK · SHIP</text>
<!-- Name and high-contrast hierarchy -->
<text x="79" y="105" font-size="16" class="small" fill="#d83438">01  /  WHO'S BUILDING?</text>
<rect x="50" y="133" width="11" height="135" fill="#f04746"/>
<text x="78" y="206" font-size="114" textLength="462" lengthAdjust="spacingAndGlyphs" class="display" fill="#12131a">HARUN</text>
<text x="78" y="288" font-size="83" textLength="515" lengthAdjust="spacingAndGlyphs" class="display" fill="#12131a">NUR RASYID</text>
<rect x="78" y="304" width="535" height="49" rx="1" fill="#cfff5b" stroke="#12131a" stroke-width="3"/>
<text x="94" y="335" font-size="20" class="small" textLength="503" lengthAdjust="spacingAndGlyphs" fill="#12131a">BACKEND ENGINEER / SYSTEMS THINKER</text>
<text x="79" y="385" font-size="19" class="display" fill="#12131a" letter-spacing=".1">BUILDING RELIABLE SYSTEMS.</text>
<text x="80" y="414" font-size="13" class="small" fill="#34343c">DISTRIBUTED SYSTEMS  /  AI  /  OPEN SOURCE</text>
<!-- Right art, deliberately confined to red region -->
<g transform="translate(892 247)">
  <path d="M0 -141L28 -104 75 -121 78 -74 127 -60 104 -21 145 16 98 38 107 88 56 85 29 136 -7 99 -50 130 -64 79 -117 62 -96 17 -138 -23 -87 -48 -94 -99 -42 -91Z" fill="#12131a"/>
  <circle r="108" fill="#f8f1e4" stroke="#12131a" stroke-width="7"/>
</g>
<circle cx="892" cy="247" r="94" stroke="#f04746" stroke-width="2" fill="none" stroke-dasharray="4 10" class="orbit"/>
<g font-family="Impact,'Arial Black','DejaVu Sans',sans-serif" font-weight="900" text-anchor="middle" fill="#12131a">
  <text x="892" y="229" font-size="49" textLength="157" lengthAdjust="spacingAndGlyphs">BUILD.</text>
  <text x="892" y="275" font-size="43" textLength="168" lengthAdjust="spacingAndGlyphs">REPEAT.</text>
</g>
<path d="M812 294H972" stroke="#12131a" stroke-width="4"/>
<text x="892" y="313" fill="#12131a" font-size="10" text-anchor="middle" class="small">EST. IN CURIOSITY</text>
<!-- Small intentionally tilted labels -->
<g class="sticker"><g transform="rotate(-5 893 100)"><rect x="772" y="78" width="243" height="43" fill="#f8f1e4" stroke="#12131a" stroke-width="4"/><text x="893" y="105" fill="#12131a" font-size="18" text-anchor="middle" class="small" letter-spacing=".5">NOT JUST CODE.</text></g></g>
<g transform="rotate(5 891 390)"><rect x="790" y="371" width="205" height="44" fill="#cfff5b" stroke="#12131a" stroke-width="4"/><text x="892" y="400" fill="#12131a" font-size="18" text-anchor="middle" class="small" letter-spacing=".1">OPEN SOURCE ↗</text></g>
<path d="M735 150L748 158L740 169" fill="none" stroke="#f8f1e4" stroke-width="4" class="spark"/>
<path d="M1020 318L1031 329L1044 318" fill="none" stroke="#f8f1e4" stroke-width="4" class="spark"/>
<!-- Bottom ticker -->
<path d="M0 435H1080V458Q1080 470 1068 470H12Q0 470 0 458Z" fill="#12131a"/>
<text x="38" y="457" font-size="13" class="small" fill="#cfff5b">◉  ENGINEERING IN PROGRESS</text>
<text x="716" y="457" font-size="13" class="small" fill="#f8f1e4">GITHUB.COM/HARUNNRYD</text>
</svg>
