name: Refresh profile artwork
on:
  workflow_dispatch:
  push:
    paths:
      - profile.config.json
      - scripts/generate.py

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG artwork and README
        run: python3 scripts/generate.py
      - name: Commit generated artwork if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): regenerate SVG artwork"
            git push
          fi
